name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend .NET Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore backend/src/Api/Api.csproj
      
    - name: Build API
      run: dotnet build backend/src/Api/Api.csproj --no-restore
      
    - name: Run xUnit Tests
      run: dotnet test backend/tests/Api.UnitTests/Api.UnitTests.csproj --verbosity normal

  frontend-build:
    name: Frontend Next.js Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Build Next.js Bundle
      working-directory: ./frontend
      run: npm run build
      env:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5080/api

  docker-verify:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
    - uses: actions/checkout@v4
    
    - name: Test Backend Dockerfile
      run: docker build -t edusync-backend -f backend.Dockerfile .
      
    - name: Test Frontend Dockerfile
      run: docker build -t edusync-frontend -f frontend.Dockerfile .

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [docker-verify]
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Start Docker Compose Stack
      run: |
        docker compose down --volumes --remove-orphans
        docker compose up -d
      
    - name: Wait for API and Web to be healthy
      shell: bash
      run: |
        set -euo pipefail

        wait_for_url() {
          local name="$1"
          local url="$2"

          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$url" > /dev/null; then
              echo "$name is ready."
              return 0
            fi

            echo "Waiting for $name ($attempt/60)..."
            sleep 2
          done

          echo "$name did not become ready in time."
          docker compose logs --no-color
          return 1
        }

        wait_for_url "API" "http://127.0.0.1:5080/health"
        wait_for_url "Web" "http://127.0.0.1:3000/login"

    - name: Verify seeded E2E credentials
      shell: bash
      run: |
        set -euo pipefail

        verify_login() {
          local role="$1"
          local email="$2"
          local response_file="/tmp/${role}-login-response.json"
          local status

          status=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --header "Content-Type: application/json" \
            --data "{\"email\":\"$email\",\"password\":\"Passw0rd!\"}" \
            http://127.0.0.1:5080/api/auth/login)

          if [ "$status" != "200" ]; then
            echo "Seeded $role login failed with HTTP $status."
            cat "$response_file"
            docker compose logs --no-color api postgres
            return 1
          fi

          echo "Seeded $role credentials are valid."
        }

        verify_login "teacher" "teacher1@school.test"
        verify_login "student" "student@school.test"
      
    - name: Install Playwright & Dependencies
      working-directory: ./tests/e2e
      run: |
        npm ci
        npx playwright install --with-deps
        
    - name: Run Playwright Tests
      working-directory: ./tests/e2e
      run: npx playwright test --workers=1

    - name: Show Docker logs on failure
      if: failure()
      run: docker compose logs --no-color
      
    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: tests/e2e/playwright-report/
        retention-days: 30
