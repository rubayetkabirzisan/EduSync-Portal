name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend .NET Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore backend/src/Api/Api.csproj
      
    - name: Build API
      run: dotnet build backend/src/Api/Api.csproj --no-restore
      
    - name: Run xUnit Tests
      run: dotnet test backend/tests/Api.UnitTests/Api.UnitTests.csproj --verbosity normal

  frontend-build:
    name: Frontend Next.js Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Build Next.js Bundle
      working-directory: ./frontend
      run: npm run build
      env:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5080/api

  docker-verify:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
    - uses: actions/checkout@v4
    
    - name: Test Backend Dockerfile
      run: docker build -t edusync-backend -f backend.Dockerfile .
      
    - name: Test Frontend Dockerfile
      run: docker build -t edusync-frontend -f frontend.Dockerfile .

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [docker-verify]
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Start Docker Compose Stack
      run: docker compose up -d
      
    - name: Wait for API and Web to be healthy
      run: sleep 15 # Give the containers a moment to boot up and run EF Migrations
      
    - name: Install Playwright & Dependencies
      working-directory: ./tests/e2e
      run: |
        npm ci
        npx playwright install --with-deps
        
    - name: Run Playwright Tests
      working-directory: ./tests/e2e
      run: npx playwright test --workers=1
      
    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: tests/e2e/playwright-report/
        retention-days: 30
