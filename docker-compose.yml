# Local development infrastructure.
services:
  postgres:
    image: postgres:16-alpine
    container_name: assignment-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assignment_system}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: assignment-system-api
    restart: unless-stopped
    ports:
      - "5080:5080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-assignment_system};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Jwt__Secret=${JWT_SECRET:-local-development-jwt-secret-at-least-32-characters}
      - Jwt__Issuer=${JWT_ISSUER:-assignment-system-api}
      - Jwt__Audience=${JWT_AUDIENCE:-assignment-system-client}
      - ChatbotApiBaseUrl=http://chatbot:8000/api/
    depends_on:
      postgres:
        condition: service_healthy

  chatbot:
    build:
      context: .
      dockerfile: chatterbot.Dockerfile
    container_name: assignment-system-chatbot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=${POSTGRES_DB:-assignment_system}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-local-development-secret-change-before-production}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5080/api}
    container_name: assignment-system-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5080/api}
    depends_on:
      - api
      - chatbot

volumes:
  postgres_data:
